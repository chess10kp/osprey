name: Jac tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  jac-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jaclang
        run: pip install jaclang

      - name: Jac test sweep (app/)
        run: ./scripts/jac-test-harness.sh
